services:
  composer:
    extends:
      file: ./docker/services-common.yml
      service: wordpress
    build:
      target: base
    entrypoint: ["composer"]
    volumes:
      - ./code:/app
    networks:
      - default
  wp:
    image: wordpress:cli-2.10.0-php${PHP_VERSION:-8.3}
    extends:
      file: ./docker/services-common.yml
      service: code-base
    entrypoint: ["wp"]
    networks:
      - site
  node:
    extends:
      file: ./docker/services-common.yml
      service: wordpress
    build:
      target: theme-base
    environment:
      - FONTAWESOME_NPM_AUTH_TOKEN=${FONTAWESOME_NPM_AUTH_TOKEN}
    ports:
      - '3000:3000'
      - '3001:3001'
    volumes:
      - ./code/web/app/themes/murr:/theme
    networks:
      - default
  wordmove:
    extends:
      file: ./docker/services-common.yml
      service: wordmove
    networks:
      - site

networks:
  site:
    external: true
    name: murr-network
