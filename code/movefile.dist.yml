global:
  sql_adapter: default

local:
  vhost: <%= ENV['WP_HOME'] %>
  wordpress_path: /html/web

  database:
    name: <%= ENV['DB_NAME'] %>
    user: <%= ENV['DB_USER'] %>
    password: "<%= ENV['DB_PASSWORD'] %>"
    host: <%= ENV['DB_HOST'] %>
    mysqldump_options: --hex-blob

  paths:
    wp_content: wp/wp-content
    uploads: app/uploads
    plugins: app/plugins
    mu_plugins: app/mu-plugins
    themes: app/themes
    languages: app/languages

staging:
  vhost: https://staging.mirandaknee.com
  wordpress_path: #addPath

  database:
    name: #addDB
    user: #addUser
    password: secret
    host: '127.0.0.1'
    mysqldump_options: --hex-blob

  paths:
    wp_content: wp/wp-content
    uploads: app/uploads
    plugins: app/plugins
    mu_plugins: app/mu-plugins
    themes: app/themes
    languages: app/languages

  exclude:
    # Root-level project files and directories
    - '/backup'
    - '/vendor'
    - '/composer.json'
    - '/composer.lock'
    - '/bin/'
    - '/tmp/'

    # Git-related
    - '.git/'
    - '.gitignore'
    - '.gitmodules'

    # Environment and config
    - '.env'
    - '.env.example'
    - '.editorconfig'
    - '.prettierignore'
    - '.prettierrc'
    - '.scss-lint.yml'
    - '.DS_Store'
    - '.vscode/'

    - '.htaccess'
    - '.idea'
    - '.sass-cache/'
    - '.quarantine/'
    - '.tmb/'

    # Node
    - 'node_modules/'

    # Ruby-related (for dev environments using bundler)
    - 'Gemfile'
    - 'Gemfile.lock'

    # Wordmove config files
    - 'Movefile'
    - 'movefile'
    - 'movefile.yml'
    - 'movefile.yaml'
    - 'movefile.dist.yml'

    # WordPress config
    - '/wp-config.php'
    - '/__wp-config.php'
    - '.htaccess'
    - '.htaccess_old'

    # SQL/database dumps and archives
    - '*.sql'
    - '*.sql.gz'
    - '*.tar.gz'
    - '*.orig'

    # Temporary/dev files
    - '__*.*'

    # README.md
    - 'README.md'

  ssh:
    host: secret
    user: #addUser

