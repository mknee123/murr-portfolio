x-build: &build-args
  DEVELOPMENT_MODE: 1
  PHP_VERSION: ${PHP_VERSION:-8.2}
  NODE_VERSION: ${NODE_VERSION:-18}
x-db: &db-env
  DB_NAME: ${MYSQL_DATABASE}
  DB_USER: ${MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD}
  DB_PREFIX: ${MYSQL_PREFIX:-wp_}
  DB_HOST: ${MYSQL_HOST}
x-wp: &wp-env
  WP_ENV: development
  WP_HOME: http://${NGINX_SERVER_NAME}
  WP_SITEURL: http://${NGINX_SERVER_NAME}/wp
  WP_DEBUG_LOG: ${WP_DEBUG_LOG:-/var/log/bedrock}

services:
  base:
    environment:
      <<: [*db-env, *wp-env]
      XDEBUG_CONFIG: "client_host=host.docker.internal start_with_request=1"
      XDEBUG_MODE: "develop,debug,profile"
  code-base:
    extends: base
    volumes:
      - ../code:/var/www/html
      - ../logs:/var/log/bedrock
      - ../backup:/backup
      - ./php/php.ini:/usr/local/etc/php/conf.d/gh-custom.ini
  wordpress:
    extends: code-base
    build:
      context: ../code
      args:
        <<: *build-args
  wordmove:
    build:
      context: ./wordmove
    environment:
      <<: [*db-env, *wp-env]
    volumes:
      - ../code:/html
      - ${SSH_PATH}:/tmp/.ssh:ro
